[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"
  SECRETS_SCAN_OMIT_KEYS = "ADMIN_USERNAME,RESEND_FROM_EMAIL,NEXT_PUBLIC_APP_URL,NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY,NEXT_PUBLIC_SUPABASE_ANON_KEY,NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME,CLOUDINARY_CLOUD_NAME,NEXT_PUBLIC_STORE_NAME,NEXT_PUBLIC_STORE_EMAIL,NEXT_PUBLIC_STORE_PHONE,NEXT_PUBLIC_WHATSAPP_NUMBER,NEXT_PUBLIC_BANK_NAME,NEXT_PUBLIC_BANK_TITLE,NEXT_PUBLIC_BANK_IBAN,NEXT_PUBLIC_JAZZCASH_TITLE,NEXT_PUBLIC_JAZZCASH_NUMBER,NEXT_PUBLIC_EASYPAISA_TITLE,NEXT_PUBLIC_EASYPAISA_NUMBER,NEXT_PUBLIC_DEFAULT_COD_FEE,NEXT_PUBLIC_MAX_COD_LIMIT,NEXT_PUBLIC_FRAGILE_PACKAGING_FEE,NEXT_PUBLIC_FREE_SHIPPING_THRESHOLD"

[[plugins]]
  package = "@netlify/plugin-nextjs"
