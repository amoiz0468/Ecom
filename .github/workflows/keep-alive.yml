name: Keep Supabase Alive

on:
  schedule:
    # Runs every 3 days at 09:00 UTC to prevent Supabase Free 7-day inactivity pause
    - cron: "0 9 */3 * *"
  workflow_dispatch:

jobs:
  ping-health:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        run: |
          if [ -z "${{ vars.SITE_URL }}" ]; then
            echo "SITE_URL repository variable is not set yet; skipping."
            exit 0
          fi
          curl -fsS "${{ vars.SITE_URL }}/api/health"

